name: AWS backup restore drill

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose latest RDS snapshot will be tested
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-restore-drill-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Restore drill ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: aurashine-restore-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Read environment state
        working-directory: infra/aws/terraform
        shell: bash
        run: |
          test -n "$AWS_ROLE_ARN" || { echo "AWS_ROLE_ARN is required"; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo "TF_STATE_BUCKET is required"; exit 1; }
          terraform init -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=aurashine/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Restore latest snapshot into an isolated database
        id: restore
        working-directory: infra/aws/terraform
        shell: bash
        run: |
          SOURCE_DB=$(terraform output -raw rds_instance_identifier)
          SNAPSHOT=$(aws rds describe-db-snapshots --db-instance-identifier "$SOURCE_DB" --query 'reverse(sort_by(DBSnapshots[?Status==`available`], &SnapshotCreateTime))[0].DBSnapshotIdentifier' --output text)
          test -n "$SNAPSHOT" && test "$SNAPSHOT" != "None" || { echo "No available RDS snapshot found."; exit 1; }
          DRILL_DB="aurashine-${{ inputs.environment }}-restore-${GITHUB_RUN_ID}"
          SUBNET_GROUP=$(terraform output -raw rds_subnet_group_name)
          SECURITY_GROUP=$(terraform output -raw rds_security_group_id)
          INSTANCE_CLASS=$(terraform output -raw rds_instance_class)
          echo "DRILL_DB=$DRILL_DB" >> "$GITHUB_ENV"
          echo "SOURCE_SNAPSHOT=$SNAPSHOT" >> "$GITHUB_ENV"
          aws rds restore-db-instance-from-db-snapshot \
            --db-instance-identifier "$DRILL_DB" \
            --db-snapshot-identifier "$SNAPSHOT" \
            --db-instance-class "$INSTANCE_CLASS" \
            --db-subnet-group-name "$SUBNET_GROUP" \
            --vpc-security-group-ids "$SECURITY_GROUP" \
            --no-publicly-accessible \
            --no-multi-az \
            --copy-tags-to-snapshot \
            --tags Key=Application,Value=AuraShine Key=Environment,Value=${{ inputs.environment }} Key=Purpose,Value=restore-drill >/dev/null
          aws rds wait db-instance-available --db-instance-identifier "$DRILL_DB"
          RESTORED_HOST=$(aws rds describe-db-instances --db-instance-identifier "$DRILL_DB" --query 'DBInstances[0].Endpoint.Address' --output text)
          echo "RESTORED_HOST=$RESTORED_HOST" >> "$GITHUB_ENV"

      - name: Validate restored database from private ECS networking
        id: validate
        working-directory: infra/aws/terraform
        shell: bash
        run: |
          RUNTIME_SECRET=$(terraform output -raw runtime_secret_arn)
          ORIGINAL_URL=$(aws secretsmanager get-secret-value --secret-id "$RUNTIME_SECRET" --query SecretString --output text | jq -r '.DATABASE_URL')
          echo "::add-mask::$ORIGINAL_URL"
          RESTORED_URL=$(ORIGINAL_URL="$ORIGINAL_URL" RESTORED_HOST="$RESTORED_HOST" python -c 'import os; from urllib.parse import urlsplit, urlunsplit; p=urlsplit(os.environ["ORIGINAL_URL"]); auth=p.netloc.rsplit("@", 1)[0]; port=p.port or 5432; netloc=auth + "@" + os.environ["RESTORED_HOST"] + ":" + str(port); print(urlunsplit((p.scheme, netloc, p.path, p.query, p.fragment)))')
          echo "::add-mask::$RESTORED_URL"
          TEMP_SECRET_NAME="aurashine-${{ inputs.environment }}/restore-drill/${GITHUB_RUN_ID}"
          TEMP_SECRET_JSON=$(jq -nc --arg url "$RESTORED_URL" '{DATABASE_URL:$url}')
          TEMP_SECRET_ARN=$(aws secretsmanager create-secret --name "$TEMP_SECRET_NAME" --description "Temporary AuraShine restore drill" --secret-string "$TEMP_SECRET_JSON" --query ARN --output text)
          echo "TEMP_SECRET_ARN=$TEMP_SECRET_ARN" >> "$GITHUB_ENV"

          MIGRATION_TASK_DEF=$(terraform output -raw migration_task_definition_arn)
          aws ecs describe-task-definition --task-definition "$MIGRATION_TASK_DEF" > task-definition.json
          jq --arg secret "$TEMP_SECRET_ARN:DATABASE_URL::" '
            .taskDefinition
            | .family = (.family + "-restore-drill")
            | .containerDefinitions[0].secrets = (.containerDefinitions[0].secrets | map(if .name == "DATABASE_URL" then .valueFrom = $secret else . end))
            | {
                family,
                taskRoleArn,
                executionRoleArn,
                networkMode,
                containerDefinitions,
                volumes,
                placementConstraints,
                requiresCompatibilities,
                cpu,
                memory,
                runtimePlatform,
                ephemeralStorage
              }
            | with_entries(select(.value != null))
          ' task-definition.json > restore-task-definition.json
          RESTORE_TASK_DEF=$(aws ecs register-task-definition --cli-input-json file://restore-task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "RESTORE_TASK_DEF=$RESTORE_TASK_DEF" >> "$GITHUB_ENV"

          CLUSTER=$(terraform output -raw ecs_cluster_name)
          SUBNETS=$(terraform output -json private_subnet_ids | jq -r 'join(",")')
          ECS_SECURITY_GROUP=$(terraform output -raw ecs_security_group_id)
          RESULT=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$RESTORE_TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$ECS_SECURITY_GROUP],assignPublicIp=DISABLED}")
          TASK_ARN=$(jq -r '.tasks[0].taskArn // empty' <<< "$RESULT")
          test -n "$TASK_ARN" || { jq '.failures' <<< "$RESULT"; exit 1; }
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[?name==`backend`].exitCode | [0]' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].{StoppedReason:stoppedReason,Containers:containers[*].{Name:name,Reason:reason,ExitCode:exitCode}}'
            aws logs tail "/aurashine/${{ inputs.environment }}/api" --since 15m || true
            exit 1
          fi
          {
            echo "### AWS restore drill passed"
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Snapshot: $SOURCE_SNAPSHOT"
            echo "- Validation: restored PostgreSQL accepted the current migration contract"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove isolated drill resources
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${RESTORE_TASK_DEF:-}" ]; then
            aws ecs deregister-task-definition --task-definition "$RESTORE_TASK_DEF" >/dev/null || true
          fi
          if [ -n "${TEMP_SECRET_ARN:-}" ]; then
            aws secretsmanager delete-secret --secret-id "$TEMP_SECRET_ARN" --force-delete-without-recovery >/dev/null || true
          fi
          if [ -n "${DRILL_DB:-}" ]; then
            aws rds delete-db-instance --db-instance-identifier "$DRILL_DB" --skip-final-snapshot --delete-automated-backups >/dev/null || true
          fi
