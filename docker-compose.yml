services:
  postgres:
    image: postgres:16-alpine
    container_name: aurashine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aura_shine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - aurashine-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aura_shine"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aurashine-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    container_name: aurashine-clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - aurashine-clamav-data:/var/lib/clamav

  # Mirrors the dedicated migration task the AWS pipeline runs before it touches
  # the service. Keeping it here means a migration that locks a busy table shows
  # up locally instead of during a production rollout.
  migrate:
    build: ./backend-rust
    container_name: aurashine-migrate
    command: ["aura-shine-backend", "--migrate-only"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/aura_shine
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN}
      MIGRATION_EVIDENCE_ENCRYPTION_KEY: ${MIGRATION_EVIDENCE_ENCRYPTION_KEY:?set MIGRATION_EVIDENCE_ENCRYPTION_KEY}
      MIGRATION_PROOF_SIGNING_KEY: ${MIGRATION_PROOF_SIGNING_KEY:?set MIGRATION_PROOF_SIGNING_KEY}

  api:
    build: ./backend-rust
    container_name: aurashine-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_ENV: development
      # The migrate service above owns the schema; see infra/aws/terraform/compute.tf.
      RUN_MIGRATIONS_ON_BOOT: "false"
      RUN_WORKERS: "true"
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/aura_shine
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_MINUTES: 15
      JWT_REFRESH_TTL_DAYS: 30
      AI_SERVICE_URL: http://ai:8081
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN}
      MIGRATION_CLAMD_ADDRESS: clamav:3310
      MIGRATION_EVIDENCE_ENCRYPTION_KEY: ${MIGRATION_EVIDENCE_ENCRYPTION_KEY:?set MIGRATION_EVIDENCE_ENCRYPTION_KEY}
      MIGRATION_PROOF_SIGNING_KEY: ${MIGRATION_PROOF_SIGNING_KEY:?set MIGRATION_PROOF_SIGNING_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:4200,http://localhost:4200,http://127.0.0.1:4300,http://localhost:4300,http://127.0.0.1:4310,http://localhost:4310,http://127.0.0.1:4320,http://localhost:4320}
    ports:
      - "127.0.0.1:8082:8080"

  ai:
    build: ./ai-service
    container_name: aurashine-ai
    restart: unless-stopped
    environment:
      APP_ENV: development
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  aurashine-pg-data:
  aurashine-clamav-data:
