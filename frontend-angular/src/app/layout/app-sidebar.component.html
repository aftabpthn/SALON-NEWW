<aside class="sidebar">
  <nav class="nav-groups" aria-label="Primary navigation">
    <div
      class="nav-group"
      *ngFor="let group of visibleGroups"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: group.exact }"
      [class.menu-open]="openGroup === group.label"
    >
      @if (group.label === 'Dashboard') {
        <a class="rail-link" [routerLink]="group.route" [attr.aria-label]="group.label" (click)="closeMenu()">
          <i class="bi" [class]="'bi ' + group.icon" aria-hidden="true"></i>
        </a>
      } @else {
        <button
          class="rail-link"
          type="button"
          [attr.aria-label]="group.label"
          aria-haspopup="true"
          [attr.aria-expanded]="openGroup === group.label"
          [attr.aria-controls]="'nav-menu-' + group.label.toLowerCase()"
          (click)="toggleGroup(group.label)"
        >
          <i class="bi" [class]="'bi ' + group.icon" aria-hidden="true"></i>
        </button>
      }
      <span class="rail-tooltip" aria-hidden="true">{{ group.label }}</span>

      @if (group.label !== 'Dashboard') {
        <section
          class="flyout"
          [id]="'nav-menu-' + group.label.toLowerCase()"
          [attr.aria-label]="group.label + ' menu'"
          [attr.aria-hidden]="openGroup !== group.label"
        >
          <header><h2>{{ group.label }}</h2></header>
          <a
            class="flyout-link"
            *ngFor="let link of group.links"
            [routerLink]="link.route"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
          >
            <i class="bi" [class]="'bi ' + link.icon" aria-hidden="true"></i>
            <span>{{ link.label }}</span>
          </a>
        </section>
      }
    </div>

    <div class="nav-group logout-group">
      <button class="rail-link" type="button" aria-label="Logout" (click)="logout()">
        <i class="bi bi-power" aria-hidden="true"></i>
      </button>
      <span class="rail-tooltip" aria-hidden="true">Logout</span>
    </div>
  </nav>
</aside>
