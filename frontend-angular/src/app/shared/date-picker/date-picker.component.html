<div class="date-picker" [class.open]="open">
  <div class="date-input-shell">
    <input
      type="text"
      inputmode="numeric"
      [placeholder]="datePlaceholder"
      #dateInput
      [attr.aria-label]="ariaLabel || ('datePicker.date' | translate)"
      [disabled]="disabled"
      [value]="draft"
      [readOnly]="rangeMode"
      (input)="!rangeMode && setDraft($any($event.target).value)"
      (blur)="normalizeDraft()"
      />
    <button type="button" [attr.aria-label]="'datePicker.openCalendar' | translate" [disabled]="disabled" (click)="toggle()">▦</button>
  </div>

  @if (open) {
    <section class="calendar-popover" role="dialog" aria-modal="false" [attr.aria-label]="'datePicker.calendar' | translate">
      <div class="calendar-main">
        <header>
          <button type="button" [attr.aria-label]="'datePicker.previousMonth' | translate" (click)="shiftMonth(-1)">‹</button>
          <div class="calendar-jump" [attr.aria-label]="monthLabel">
            <select [attr.aria-label]="'datePicker.month' | translate" [ngModel]="selectedMonth" (ngModelChange)="setViewMonth($event)">
              @for (month of months; track month.value) {
                <option [ngValue]="month.value">{{ month.label }}</option>
              }
            </select>
            <select [attr.aria-label]="'datePicker.year' | translate" [ngModel]="selectedYear" (ngModelChange)="setViewYear($event)">
              @for (year of yearOptions; track year) {
                <option [ngValue]="year">{{ year }}</option>
              }
            </select>
          </div>
          <button type="button" [attr.aria-label]="'datePicker.nextMonth' | translate" (click)="shiftMonth(1)">›</button>
        </header>
        @if (rangeMode) {
          <div class="range-fields">
            <label>
              <span>{{ 'datePicker.from' | translate }}</span>
              <input type="text" inputmode="numeric" [placeholder]="datePlaceholder" [value]="rangeStartInput" (input)="setRangeDraft('start', $any($event.target).value)" />
            </label>
            <label>
              <span>{{ 'datePicker.to' | translate }}</span>
              <input type="text" inputmode="numeric" [placeholder]="datePlaceholder" [value]="rangeEndInput" (input)="setRangeDraft('end', $any($event.target).value)" />
            </label>
          </div>
        }
        @if (rangeMode && reportPresets) {
          <div class="preset-row" aria-label="Report range presets">
            <button type="button" (click)="selectQuarter(1)">Q1</button>
            <button type="button" (click)="selectQuarter(2)">Q2</button>
            <button type="button" (click)="selectQuarter(3)">Q3</button>
            <button type="button" (click)="selectQuarter(4)">Q4</button>
            <button type="button" (click)="selectViewYear()">{{ 'datePicker.year' | translate }}</button>
          </div>
        }
        <div class="weekday-row">
          @for (day of weekDays; track day) {
            <span>{{ day }}</span>
          }
        </div>
        <div class="day-grid">
          @for (day of days(); track day.iso) {
            <button
              type="button"
              [class.muted]="!day.inMonth"
              [class.selected]="day.selected"
              [class.today]="day.today"
              [class.in-range]="day.inRange"
              [attr.aria-pressed]="day.selected"
              (click)="selectDate(day.iso)"
              >
              {{ day.label }}
            </button>
          }
        </div>
        <footer>
          <button type="button" (click)="clear()">{{ 'common.clear' | translate }}</button>
          <span></span>
          <button type="button" (click)="today()">{{ 'datePicker.today' | translate }}</button>
          <button class="apply" type="button" (click)="apply()">{{ 'common.apply' | translate }}</button>
        </footer>
      </div>
    </section>
  }
</div>
